[project]
name = "rtdiffusion-backend"
version = "0.1.0"
description = "FastAPI WebSocket backend for real-time diffusion inpainting."
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "aiortc>=1.9.0",
]

[project.optional-dependencies]
gpu = [
  "accelerate>=0.33.0",
  "diffusers>=0.38.0",
  "einops>=0.8.0",
  "ftfy>=6.3.0",
  "safetensors>=0.4.4",
  "transformers>=4.57.0,<5",
  "huggingface-hub<1",
  "av>=12.0.0",
  "imageio[ffmpeg]>=2.36.0",
  "peft>=0.19.0",
  "protobuf>=5.27.0",
  "sentencepiece>=0.2.0",
  "controlnet-aux>=0.0.7",
]
tensorrt = [
  "tensorrt>=10.0.0",
  "onnx>=1.16.0",
]
tagger = [
  "onnxruntime-gpu>=1.18.0",
  "huggingface-hub<1",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 100